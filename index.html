<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mach Media Publishing</title>
  <meta name="description" content="Videos from the Mach Media Publishing team.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%230e0f12%27/%3E%3Ctext x=%2716%27 y=%2722%27 text-anchor=%27middle%27 font-size=%2714%27 fill=%27%23fff%27 font-family=%27sans-serif%27 font-weight=%27700%27%3EM%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#0e0f12">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header" role="banner">
    <div class="wrap brand">
      <img
        class="logo"
        src="assets/logo.png"
        width="200"
        height="200"
        alt="Mach Media Publishing logo"
      >
      <p class="intro">Videos from the Mach Media Publishing team</p>
    </div>
  </header>

  <main id="main" class="wrap" role="main">
    <h2 class="section-title" id="videos-heading">Videos</h2>
    <ul class="video-grid" id="video-grid" aria-labelledby="videos-heading">
      <li class="video-meta" role="status">Loading videos…</li>
    </ul>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="wrap">
      <p>&copy; Mach Media Publishing</p>
    </div>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
